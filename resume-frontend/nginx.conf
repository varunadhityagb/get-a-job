server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached — it's what points at the current
    # build's hashed JS/CSS filenames. If a browser caches it, a rebuild
    # can silently "not take effect" because the browser keeps loading an
    # old index.html that references a bundle which no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed filenames (Vite's default output) are safe to cache
    # aggressively — a new build always gets a new filename.
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
